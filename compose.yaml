services:
  backend:
    build: ./backend
    environment:
      OIDC_ISSUER: http://localhost:8080/realms/freshness
      OIDC_AUDIENCE: freshness-api
      OIDC_JWKS_URL: http://127.0.0.1:8080/realms/freshness/protocol/openid-connect/certs
      OIDC_LOCAL_HTTP: "true"
      DATABASE_PATH: /data/freshness.sqlite
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8080:8080"
    volumes:
      - app-data:/data
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    network_mode: service:backend
    command: [start-dev, --import-realm, --hostname=http://localhost:8080]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
    volumes:
      - ./deploy/freshness-realm.json:/opt/keycloak/data/import/freshness-realm.json:ro
      - identity-data:/opt/keycloak/data
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:5173:8080"]
    depends_on:
      backend:
        condition: service_healthy
volumes:
  app-data:
  identity-data:
